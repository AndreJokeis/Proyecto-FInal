<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Northwind POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h4 fw-bold text-center mb-1">Northwind POS</h1>
                        <p class="text-muted text-center small mb-4">Inicia sesión con tu cuenta</p>

                        <div id="login-alert"></div>

                        <form id="login-form" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       autocomplete="username"
                                       placeholder="correo@ejemplo.com"
                                       required>
                                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       autocomplete="current-password"
                                       required>
                                <div class="invalid-feedback">La contraseña es obligatoria.</div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" id="btn-submit" class="btn btn-primary">
                                    Iniciar sesión
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <p class="text-center small mb-0">
                            ¿Eres cliente nuevo?
                            <a href="register.html" class="link-primary fw-semibold">Crear cuenta</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
