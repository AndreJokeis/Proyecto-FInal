<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alta de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="mb-4">
                    <h1 class="h3 fw-bold mb-1">Alta de Empleados y Administradores</h1>
                </div>

                <div id="employee-alert"></div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form id="employee-form" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="firstName" class="form-label">Nombre(s) *</label>
                                    <input type="text" class="form-control" id="firstName" maxlength="10" required>
                                    <div class="invalid-feedback">El nombre es obligatorio (máx. 10 caracteres).</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="lastName" class="form-label">Apellido(s) *</label>
                                    <input type="text" class="form-control" id="lastName" maxlength="20" required>
                                    <div class="invalid-feedback">El apellido es obligatorio (máx. 20 caracteres).</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="title" class="form-label">Puesto</label>
                                    <input type="text" class="form-control" id="title" maxlength="30" placeholder="Ej. Cajero / Ventas">
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="role" class="form-label">Rol del sistema *</label>
                                    <select class="form-select" id="role" required>
                                        <option value="Employee" selected>Employee (Empleado)</option>
                                        <option value="Admin">Admin (Administrador)</option>
                                    </select>
                                    <div class="invalid-feedback">Selecciona un rol válido.</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">Correo electrónico *</label>
                                    <input type="email" class="form-control" id="email" autocomplete="off" required>
                                    <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label">Contraseña temporal *</label>
                                    <input type="password" class="form-control" id="password" minlength="8" autocomplete="new-password" required>
                                    <div class="invalid-feedback">Mínimo 8 caracteres.</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                                <button type="submit" id="btn-save-employee" class="btn btn-primary">
                                    Registrar empleado
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/empleados.js"></script>
</body>
</html>
