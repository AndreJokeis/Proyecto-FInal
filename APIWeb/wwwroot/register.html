<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h4 fw-bold text-center mb-1">Registro de Cliente</h1>
                        <p class="text-muted text-center small mb-4">Crea tu cuenta para consultar el catálogo y realizar compras</p>

                        <div id="register-alert"></div>

                        <form id="register-form" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo o empresa *</label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       name="nombre"
                                       maxlength="40"
                                       placeholder="Ej. Luis Fonseca"
                                       required>
                                <div class="invalid-feedback">El nombre es obligatorio.</div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico *</label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       autocomplete="username"
                                       placeholder="correo@ejemplo.com"
                                       required>
                                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña *</label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       autocomplete="new-password"
                                       minlength="8"
                                       required>
                                <div class="form-text">Mínimo 8 caracteres.</div>
                                <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirmar contraseña *</label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       autocomplete="new-password"
                                       minlength="8"
                                       required>
                                <div class="invalid-feedback" id="confirm-feedback">Las contraseñas deben coincidir.</div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" id="btn-submit" class="btn btn-primary">
                                    Crear cuenta
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <p class="text-center small mb-0">
                            ¿Ya tienes una cuenta?
                            <a href="login.html" class="link-primary fw-semibold">Iniciar sesión</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/register.js"></script>
</body>
</html>
