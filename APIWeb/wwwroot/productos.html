<!DOCTYPE html>
<!-- ==========================================================================
     ARCHIVO: wwwroot/productos.html
     PROPÓSITO: Vista del Catálogo de Productos (controlada por js/pages/productos.js).
     AQUÍ SE MUESTRA:
     - Buscador y filtros por categoría y por estado (Disponibles, Sin stock,
       Descontinuados).
     - Tabla de productos y modal #productModal para Crear/Editar productos
       (habilitado únicamente cuando el usuario tiene rol Admin o Employee).
     ========================================================================== -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Productos - Fashion Roma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Catálogo de Productos</h1>
                <p class="text-muted small mb-0" id="page-subtitle">Consulta disponibilidad, precios y estado del inventario.</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" id="btn-new-product" class="btn btn-success d-none">
                    + Nuevo producto
                </button>
            </div>
        </div>

        <div id="page-alert"></div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-md-4">
                        <input type="search"
                               id="search-input"
                               class="form-control form-control-sm"
                               placeholder="Buscar por nombre, presentación o ID...">
                    </div>
                    <div class="col-6 col-md-3">
                        <select id="category-filter" class="form-select form-select-sm" aria-label="Filtrar por categoría">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <select id="status-filter" class="form-select form-select-sm" aria-label="Filtrar por estado">
                            <option value="">Todos los estados</option>
                            <option value="available">Disponibles</option>
                            <option value="out_of_stock">Sin stock</option>
                            <option value="discontinued">Descontinuados</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2 text-md-end">
                        <span class="badge text-bg-success" id="products-count">0 productos</span>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Proveedor</th>
                            <th class="text-end">Precio</th>
                            <th class="text-center">Stock</th>
                            <th class="text-center">Estado</th>
                            <th class="text-end d-none" id="th-actions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Crear / Editar Producto (solo Admin / Employee) -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="product-form" class="needs-validation" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="productModalLabel">Nuevo producto</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <div id="modal-alert"></div>

                        <div class="row g-3">
                            <div class="col-12 col-md-7">
                                <label for="productName" class="form-label">Nombre del producto *</label>
                                <input type="text"
                                       class="form-control"
                                       id="productName"
                                       maxlength="40"
                                       required>
                                <div class="invalid-feedback">El nombre es obligatorio (máximo 40 caracteres).</div>
                            </div>

                            <div class="col-12 col-md-5">
                                <label for="quantityPerUnit" class="form-label">Presentación</label>
                                <input type="text"
                                       class="form-control"
                                       id="quantityPerUnit"
                                       maxlength="20"
                                       placeholder="Ej. 24 - 12 oz bottles">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="categoryId" class="form-label">Categoría</label>
                                <select id="categoryId" class="form-select">
                                    <option value="">Sin categoría</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="supplierId" class="form-label">Proveedor</label>
                                <select id="supplierId" class="form-select">
                                    <option value="">Sin proveedor</option>
                                </select>
                            </div>

                            <div class="col-6">
                                <label for="unitPrice" class="form-label">Precio ($) *</label>
                                <input type="number"
                                       class="form-control"
                                       id="unitPrice"
                                       min="0.01"
                                       step="0.01"
                                       required>
                                <div class="invalid-feedback">Ingresa un precio mayor a 0.</div>
                            </div>

                            <div class="col-6">
                                <label for="unitsInStock" class="form-label">Stock *</label>
                                <input type="number"
                                       class="form-control"
                                       id="unitsInStock"
                                       min="0"
                                       step="1"
                                       required>
                                <div class="invalid-feedback">Ingresa un stock válido (0 o mayor).</div>
                            </div>

                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="discontinued">
                                    <label class="form-check-label" for="discontinued">
                                        Producto descontinuado (no se podrá vender en el Punto de Venta)
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btn-save-product" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/productos.js?v=3"></script>
</body>
</html>
