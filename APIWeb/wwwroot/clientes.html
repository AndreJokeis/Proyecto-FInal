<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Gestión de Clientes</h1>
            </div>
            <button type="button" id="btn-new-customer" class="btn btn-primary">
                + Nuevo cliente
            </button>
        </div>

        <div id="page-alert"></div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-md-6 col-lg-4">
                        <input type="search"
                               id="search-input"
                               class="form-control form-control-sm"
                               placeholder="Buscar por ID, empresa, contacto o ciudad...">
                    </div>
                    <div class="col-12 col-md-6 col-lg-8 text-md-end">
                        <span class="badge text-bg-secondary" id="customers-count">0 clientes</span>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Empresa</th>
                            <th>Contacto</th>
                            <th>Ciudad / País</th>
                            <th>Teléfono</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="customers-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Crear / Editar Cliente -->
    <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="customer-form" class="needs-validation" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="customerModalLabel">Nuevo cliente</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <div id="modal-alert"></div>

                        <div class="row g-3">
                            <div class="col-12 col-md-4">
                                <label for="customerId" class="form-label">ID Cliente *</label>
                                <input type="text"
                                       class="form-control text-uppercase"
                                       id="customerId"
                                       minlength="3"
                                       maxlength="5"
                                       pattern="[A-Za-z0-9]{3,5}"
                                       placeholder="Ej. ALFKI"
                                       required>
                                <div class="invalid-feedback">3 a 5 letras o números (sin espacios).</div>
                            </div>

                            <div class="col-12 col-md-8">
                                <label for="companyName" class="form-label">Nombre de la empresa *</label>
                                <input type="text"
                                       class="form-control"
                                       id="companyName"
                                       maxlength="40"
                                       required>
                                <div class="invalid-feedback">Obligatorio (máximo 40 caracteres).</div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="contactName" class="form-label">Nombre de contacto</label>
                                <input type="text" class="form-control" id="contactName" maxlength="30">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="contactTitle" class="form-label">Cargo del contacto</label>
                                <input type="text" class="form-control" id="contactTitle" maxlength="30">
                            </div>

                            <div class="col-12">
                                <label for="address" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="address" maxlength="60">
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="city" class="form-label">Ciudad</label>
                                <input type="text" class="form-control" id="city" maxlength="15">
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="region" class="form-label">Región / Estado</label>
                                <input type="text" class="form-control" id="region" maxlength="15">
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="postalCode" class="form-label">Código postal</label>
                                <input type="text" class="form-control" id="postalCode" maxlength="10">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="country" class="form-label">País</label>
                                <input type="text" class="form-control" id="country" maxlength="15">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="phone" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="phone" maxlength="24">
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btn-save-customer" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/clientes.js"></script>
</body>
</html>
