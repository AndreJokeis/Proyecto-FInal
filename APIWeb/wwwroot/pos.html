<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punto de Venta - Northwind POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container-fluid px-4 pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h3 fw-bold mb-0" id="page-title">Punto de Venta</h1>
            <a href="ventas.html" class="btn btn-outline-secondary btn-sm">Ver historial</a>
        </div>

        <div id="page-alert"></div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <div class="row g-2 align-items-center">
                            <div class="col-12 col-sm-6">
                                <h2 class="h6 fw-bold mb-0">Catálogo de Productos</h2>
                            </div>
                            <div class="col-12 col-sm-6">
                                <input type="search"
                                       id="search-input"
                                       class="form-control form-control-sm"
                                       placeholder="Buscar producto...">
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-end">Precio</th>
                                    <th class="text-center">Stock</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-end">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="products-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                        <h2 class="h6 fw-bold mb-0">Carrito de Compra</h2>
                        <button type="button" id="btn-clear-cart" class="btn btn-outline-light btn-sm">Vaciar</button>
                    </div>
                    <div class="card-body">
                        <div class="mb-3 d-none" id="customer-section">
                            <label for="customer-select" class="form-label fw-semibold">Cliente *</label>
                            <select id="customer-select" class="form-select">
                                <option value="">Selecciona un cliente...</option>
                            </select>
                        </div>

                        <div class="table-responsive mb-3" style="max-height: 38vh; overflow-y: auto;">
                            <table class="table table-sm align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th class="text-center" style="width: 120px;">Cant.</th>
                                        <th class="text-end">Subtotal</th>
                                        <th class="text-end"></th>
                                    </tr>
                                </thead>
                                <tbody id="cart-tbody"></tbody>
                            </table>
                        </div>

                        <div class="border-top pt-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fs-5 fw-bold">Total estimado:</span>
                                <span class="fs-4 fw-bold text-success" id="cart-total">$0.00</span>
                            </div>
                            <div class="text-muted small">El servidor valida stock y calcula los precios oficiales.</div>
                        </div>

                        <button type="button" id="btn-confirm-sale" class="btn btn-success w-100 py-2 fw-semibold" disabled>
                            Confirmar venta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/pos.js"></script>
</body>
</html>
