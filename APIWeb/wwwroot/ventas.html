<!DOCTYPE html>
<!-- ==========================================================================
     ARCHIVO: wwwroot/ventas.html
     PROPÓSITO: Vista de Historial de Ventas (para Admin/Employee) o Mis Pedidos
                (para Customer). Controlada por js/pages/ventas.js.
     AQUÍ SE MUESTRA:
     - Tabla principal con ID Orden, Cliente, Vendedor (empleado que vendió en
       la tabla 'employees'), Fecha, Destino (tomado del cliente en 'customers'),
       Total y botón "Ver detalle".
     - Modal #orderDetailModal con el desglose de productos vendidos en la orden.
     ========================================================================== -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de Ventas - Fashion Roma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1" id="page-title">Historial de Ventas</h1>
            </div>
        </div>

        <div id="page-alert"></div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-md-6 col-lg-4">
                        <input type="search"
                               id="search-input"
                               class="form-control form-control-sm"
                               placeholder="Buscar por ID, cliente, vendedor o destino...">
                    </div>
                    <div class="col-12 col-md-6 col-lg-8 text-md-end">
                        <span class="badge text-bg-success" id="orders-count">0 órdenes</span>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID Orden</th>
                            <th>Cliente</th>
                            <th>Vendedor</th>
                            <th>Fecha</th>
                            <th>Destino</th>
                            <th class="text-end">Total</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h2 class="modal-title fs-5" id="orderDetailModalLabel">Detalle de Orden</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="modal-alert"></div>

                    <div class="row g-2 mb-3 small text-muted">
                        <div class="col-sm-6 col-md-3">
                            <div><strong>Cliente:</strong> <span id="detail-customer">-</span></div>
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <div><strong>Vendedor:</strong> <span id="detail-employee">-</span></div>
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <div><strong>Fecha:</strong> <span id="detail-date">-</span></div>
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <div><strong>Destino:</strong> <span id="detail-destination">-</span></div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm table-bordered align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-end">Precio Unit.</th>
                                    <th class="text-center">Cantidad</th>
                                    <th class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="detail-items-tbody"></tbody>
                        </table>
                    </div>

                    <div class="text-end fw-bold fs-5 text-success mt-3">
                        Total: $<span id="detail-total">0.00</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/ventas.js?v=3"></script>
</body>
</html>
