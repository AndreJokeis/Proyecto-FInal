<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de Ventas - Northwind POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1" id="page-title">Historial de Ventas</h1>
            </div>
            <a href="pos.html" class="btn btn-primary">+ Nueva venta</a>
        </div>

        <div id="page-alert"></div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-md-6 col-lg-4">
                        <input type="search"
                               id="search-input"
                               class="form-control form-control-sm"
                               placeholder="Buscar por ID, cliente, ciudad o país...">
                    </div>
                    <div class="col-12 col-md-6 col-lg-8 text-md-end">
                        <span class="badge text-bg-secondary" id="orders-count">0 órdenes</span>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID Orden</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Destino</th>
                            <th class="text-end">Total</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="orderDetailModalLabel">Detalle de Orden</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="modal-alert"></div>

                    <div class="row g-2 mb-3 small text-muted">
                        <div class="col-md-6">
                            <div><strong>Cliente:</strong> <span id="detail-customer">-</span></div>
                            <div><strong>Fecha:</strong> <span id="detail-date">-</span></div>
                        </div>
                        <div class="col-md-6">
                            <div><strong>Destino:</strong> <span id="detail-destination">-</span></div>
                            <div><strong>Empleado ID:</strong> <span id="detail-employee">-</span></div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm table-bordered align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-end">Precio Unit.</th>
                                    <th class="text-center">Cantidad</th>
                                    <th class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="detail-items-tbody"></tbody>
                        </table>
                    </div>

                    <div class="text-end fw-bold fs-5 mt-3">
                        Total: $<span id="detail-total">0.00</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/ventas.js"></script>
</body>
</html>
